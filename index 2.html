</style></head><body><header><div class="brand"><span class="brand-mark">F<span class="brand-j">J</span>ORGE<span class="brand-dot">.</span></span><span class="brand-sub">STRENGTH / TRACKED</span></div><nav><button onclick="go('home')">Overview</button><button onclick="go('log')">Log workout</button><button onclick="go('history')">History</button><button onclick="go('progress')">Progress</button><button onclick="go('settings')">Data</button></nav></header><main id="app"></main><div id="toast"></div><script>
const PLAN=[{"day": "Monday", "name": "Barbell Bench Press", "sets": 4, "min": 6, "max": 8, "step": 5, "mode": "load", "units": "Total barbell lb", "tip": "Controlled reps; 2–3 min rest", "id": "e21"}, {"day": "Monday", "name": "One-Arm DB Row", "sets": 4, "min": 8, "max": 10, "step": 2.5, "mode": "load", "units": "One DB; reps/side", "tip": "Log weaker side; match both sides", "id": "e22"}, {"day": "Monday", "name": "Standing DB Overhead Press", "sets": 3, "min": 6, "max": 8, "step": 2.5, "mode": "load", "units": "Each DB lb", "tip": "Keep ribs down", "id": "e23"}, {"day": "Monday", "name": "Cable Face Pull", "sets": 3, "min": 15, "max": 20, "step": 5, "mode": "load", "units": "Cable stack lb", "tip": "Keep pulley height and attachment consistent; log actual stack weight for each set", "id": "e24"}, {"day": "Monday", "name": "Cable Triceps Pressdown", "sets": 3, "min": 10, "max": 15, "step": 2.5, "mode": "load", "units": "Plates on pin lb", "tip": "High pulley; keep elbows still", "id": "e25"}, {"day": "Monday", "name": "Dead Bug", "sets": 3, "min": 8, "max": 8, "step": 0, "mode": "control", "units": "Reps/side", "tip": "Slow exhale; keep lower back down", "id": "e26"}, {"day": "Tuesday", "name": "Back Squat", "sets": 4, "min": 5, "max": 8, "step": 5, "mode": "load", "units": "Total barbell lb", "tip": "Consistent depth; 2–3 min rest", "id": "e27"}, {"day": "Tuesday", "name": "Conventional Deadlift", "sets": 3, "min": 3, "max": 5, "step": 5, "mode": "load", "units": "Total barbell lb", "tip": "Stop at bar-speed drop; never grind", "id": "e28"}, {"day": "Tuesday", "name": "DB Walking Lunge", "sets": 3, "min": 10, "max": 12, "step": 2.5, "mode": "load", "units": "Each DB; reps/leg", "tip": "Log weaker side; match both legs", "id": "e29"}, {"day": "Tuesday", "name": "Barbell Hip Thrust", "sets": 3, "min": 10, "max": 12, "step": 5, "mode": "load", "units": "Total barbell lb", "tip": "Pause at full hip extension", "id": "e30"}, {"day": "Tuesday", "name": "Standing Calf Raise", "sets": 4, "min": 10, "max": 15, "step": 2.5, "mode": "load", "units": "Added total lb", "tip": "Same setup each time; full range", "id": "e31"}, {"day": "Thursday", "name": "Incline Barbell Bench Press", "sets": 3, "min": 8, "max": 10, "step": 5, "mode": "load", "units": "Total barbell lb", "tip": "Consistent incline; controlled lower", "id": "e32"}, {"day": "Thursday", "name": "Band-Assisted Pull-Up", "sets": 3, "min": 6, "max": 10, "step": 0, "mode": "band", "units": "Band in notes", "tip": "Log band and foothold; no lb volume", "id": "e33"}, {"day": "Thursday", "name": "Lat Pulldown", "sets": 3, "min": 8, "max": 12, "step": 2.5, "mode": "load", "units": "Plates on pin lb", "tip": "High pulley; full comfortable reach", "id": "e34"}, {"day": "Thursday", "name": "DB Lateral Raise", "sets": 4, "min": 12, "max": 15, "step": 2.5, "mode": "load", "units": "Each DB lb", "tip": "Smallest available jump; no swinging", "id": "e35"}, {"day": "Thursday", "name": "Barbell or DB Curl", "sets": 3, "min": 10, "max": 12, "step": 2.5, "mode": "load", "units": "BB total / each DB", "tip": "Record implement; keep it consistent", "id": "e36"}, {"day": "Thursday", "name": "Flat Dumbbell Bench Press", "sets": 2, "min": 10, "max": 15, "step": 2.5, "mode": "load", "units": "Each dumbbell lb", "tip": "1–2 RIR; rest 2–3 minutes. Increase weight when both sets reach 15 reps with good form.", "id": "e37"}, {"day": "Thursday", "name": "Plank", "sets": 2, "min": 30, "max": 45, "step": 0, "mode": "time", "units": "Seconds/set", "tip": "Breathe; keep position consistent", "id": "e38"}, {"day": "Friday", "name": "DB Bulgarian Split Squat", "sets": 3, "min": 8, "max": 10, "step": 2.5, "mode": "load", "units": "Each DB; reps/leg", "tip": "Log weaker side; match both legs", "id": "e39"}, {"day": "Friday", "name": "Barbell Romanian Deadlift", "sets": 3, "min": 8, "max": 10, "step": 5, "mode": "load", "units": "Total barbell lb", "tip": "Controlled hinge; avoid grinding", "id": "e40"}, {"day": "Friday", "name": "Seated Cable Row", "sets": 3, "min": 8, "max": 12, "step": 2.5, "mode": "load", "units": "Plates on pin lb", "tip": "Low pulley; keep torso steady", "id": "e41"}, {"day": "Friday", "name": "Band Hamstring Curl", "sets": 3, "min": 12, "max": 15, "step": 0, "mode": "band", "units": "Band in notes", "tip": "Keep band length consistent", "id": "e42"}, {"day": "Friday", "name": "Standing Calf Raise", "sets": 3, "min": 12, "max": 15, "step": 2.5, "mode": "load", "units": "Added total lb", "tip": "Use same setup within this day", "id": "e43"}];
const DAYS=['Monday','Tuesday','Thursday','Friday'],FOCUS={'Monday':'Upper strength','Tuesday':'Lower strength','Thursday':'Upper hypertrophy','Friday':'Lower + pull'};
const KEY='forge-fresh-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{sessions:[],draft:null}}catch{state={sessions:[],draft:null}};state.sessions||=[];let view='home',selected='Monday',chartId=PLAN[0].id;
const $=id=>document.getElementById(id),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:1});
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}function go(v){view=v;render();window.scrollTo(0,0)}
function previous(id,exclude){return state.sessions.filter(s=>s.id!==exclude).flatMap(s=>s.exercises.map(e=>({...e,date:s.date}))).filter(e=>e.id===id).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function volume(s){return s.exercises.reduce((t,e)=>{let p=PLAN.find(x=>x.id===e.id);return t+(p?.mode==='load'||p?.mode==='added'?e.sets.reduce((v,x)=>v+(Number(x.weight)||0)*(Number(x.reps)||0),0):0)},0)}
function calories(s){const minutes=Number(s.durationMinutes),weight=Number(s.bw),met=Number(s.intensityMet||3.5);return Number.isFinite(minutes)&&minutes>0&&Number.isFinite(weight)&&weight>0?Math.round(met*3.5*(weight/2.20462)/200*minutes):null}
function calorieText(s){const n=calories(s);return n===null?'Calories not estimated':fmt(n)+' estimated kcal'}
function calorieSummary(){
  const now=new Date();
  const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const currentDay=localDate(now);
  const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
  const weekStart=localDate(monday);
  return state.sessions.reduce((totals,session)=>{
    const value=calories(session);
    if(value===null)return totals;
    totals.lifetime+=value;
    if(session.date===currentDay)totals.daily+=value;
    if(typeof session.date==='string'&&session.date>=weekStart&&session.date<=currentDay)totals.weekly+=value;
    return totals;
  },{daily:0,weekly:0,lifetime:0});
}
function completed(s){return s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.reps!==''&&x.reps!=null).length,0)}
function home(){let n=state.sessions.length,vol=state.sessions.reduce((a,s)=>a+volume(s),0),recent=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="line"><div><h1>Your strength, recorded.</h1><p class="muted">Your exact four-day program from Workout Tracker v3. No fixed week limit.</p></div><button class="primary" onclick="go('log')">+ Start workout</button></div><div class="grid"><div class="card"><div class="muted">Sessions logged</div><div class="stat">${n}</div></div><div class="card"><div class="muted">Recorded weighted volume</div><div class="stat">${fmt(vol)} <small>lb</small></div></div><div class="card"><div class="muted">Sets recorded</div><div class="stat">${state.sessions.reduce((a,s)=>a+completed(s),0)}</div></div></div><div class="card calorie-panel"><div class="line"><div><span class="pill">Energy estimate</span><h2 style="margin-top:12px">Estimated calories burned</h2></div><span class="muted small">Based on your logged sessions</span></div><div class="calorie-grid">${[['Today',calorieSummary().daily,'Current calendar day'],['This week',calorieSummary().weekly,'Monday through today'],['Lifetime',calorieSummary().lifetime,'All recorded sessions']].map(([label,value,sub])=>`<div class="calorie-tile"><div class="muted small">${label}</div><div class="stat">${fmt(value)} <small>kcal</small></div><div class="muted small">${sub}</div></div>`).join('')}</div><p class="muted small">MET-based estimates, not measured calories. Only sessions with recorded bodyweight and duration are counted.</p></div><h2>Training split</h2><div class="grid">${DAYS.map(d=>`<div class="card"><div class="pill">${d}</div><h2 style="margin-top:12px">${FOCUS[d]}</h2><p class="muted">${PLAN.filter(p=>p.day===d).length} exercises</p><button onclick="chooseDay('${d}')">Log ${d} →</button></div>`).join('')}</div><h2>Recent workouts</h2>${recent.length?recent.slice(0,5).map(s=>`<div class="card line"><div><b>${escapeHTML(s.day)} · ${escapeHTML(FOCUS[s.day])}</b><p class="muted small">${escapeHTML(s.date)} · ${completed(s)} sets · ${fmt(volume(s))} lb volume · ${calorieText(s)}</p></div><button onclick="openSession('${s.id}')">View</button></div>`).join(''):'<div class="card muted">No sessions yet. Your first workout is ready to log.</div>'}`}
function chooseDay(day){if(state.draft&&state.draft.day!==day){if(!confirm('You have an unfinished '+state.draft.day+' workout. Switch to '+day+'? The unfinished draft will be discarded.'))return;state.draft=null}selected=day;if(!state.draft)startDraft();go('log')}
function startDraft(){let last=state.sessions.filter(s=>s.day===selected).sort((a,b)=>b.date.localeCompare(a.date))[0];state.draft={id:'s'+Date.now(),day:selected,date:today(),bw:'',durationMinutes:'',intensityMet:'3.5',notes:'',exercises:PLAN.filter(p=>p.day===selected).map(p=>{let prev=last?.exercises.find(x=>x.id===p.id)||previous(p.id);return{id:p.id,notes:prev?.notes||'',rir:'',sets:Array.from({length:p.sets},(_,i)=>({weight:prev?.sets[i]?.weight??'',reps:''}))}})};save()}
function log(){let d=state.draft;if(!d)return `<h1>Log a workout</h1><p class="muted">Choose a session from your actual spreadsheet program.</p><div class="grid">${DAYS.map(x=>`<div class="card"><h2>${x}</h2><p class="muted">${FOCUS[x]}</p><button class="primary" onclick="chooseDay('${x}')">Start session</button></div>`).join('')}</div>`;return `<div class="line"><div><h1>${d.day} · ${FOCUS[d.day]}</h1><p class="muted">Autosaved draft · edit weights for back-off sets individually</p></div><div class="row"><select aria-label="Switch workout day" onchange="chooseDay(this.value)">${DAYS.map(day=>`<option value="${day}" ${d.day===day?'selected':''}>${day} · ${FOCUS[day]}</option>`).join('')}</select><button onclick="if(confirm('Discard this draft?')){state.draft=null;save();render()}">Discard draft</button></div></div><div class="card row"><label>Date<input type="date" value="${escapeHTML(d.date)}" onchange="updateDraft('date',this.value)"></label><label>Bodyweight (lb)<input type="number" min="1" step=".1" value="${escapeHTML(d.bw)}" oninput="updateDraft('bw',this.value)"></label><label>Workout duration (minutes)<input type="number" min="1" step="1" value="${escapeHTML(d.durationMinutes??'')}" oninput="updateDraft('durationMinutes',this.value)"></label><label>Intensity<select onchange="updateDraft('intensityMet',this.value)"><option value="3.5" ${String(d.intensityMet||'3.5')==='3.5'?'selected':''}>Moderate · 3.5 MET</option><option value="6" ${String(d.intensityMet)==='6'?'selected':''}>Vigorous · 6 MET</option></select></label><div class="muted small" id="cal-preview">${calorieText(d)} · estimate includes resting energy</div></div>${d.exercises.map((e,ix)=>{let p=PLAN.find(x=>x.id===e.id),prev=previous(p.id);let target=p.mode==='added'?'AMRAP':`${p.min}–${p.max} ${p.mode==='time'?'sec':'reps'}`;return `<section class="card"><div class="line"><div><span class="pill">${ix+1} / ${d.exercises.length}</span><h2 style="margin:10px 0 4px">${escapeHTML(p.name)}</h2><div class="muted small">${p.sets} sets × ${target} · ${escapeHTML(p.units)}</div></div><div class="pill">${p.step?`+${p.step} lb step`:p.mode}</div></div><p class="note">${escapeHTML(p.tip)}</p>${prev?`<p class="muted small">Last: ${escapeHTML(prev.date)} · ${prev.sets.map(s=>`${s.weight!==''?s.weight+' lb × ':''}${s.reps||'—'}`).join(' / ')}</p>`:''}<div class="sets">${e.sets.map((set,j)=>`<div class="set"><b>Set ${j+1}</b>${!['band','control','time'].includes(p.mode)?`<label>${p.mode==='added'?'Added lb':'Weight lb'}<input type="number" step=".5" value="${escapeHTML(set.weight)}" oninput="updateSet(${ix},${j},'weight',this.value)"></label>`:''}<label>${p.mode==='time'?'Seconds':'Reps'}<input type="number" min="0" value="${escapeHTML(set.reps)}" oninput="updateSet(${ix},${j},'reps',this.value)"></label></div>`).join('')}</div><div class="row" style="margin-top:12px"><label>Reps left (RIR)<input type="number" min="0" max="10" value="${escapeHTML(e.rir)}" oninput="updateExercise(${ix},'rir',this.value)"></label><label style="flex:1">Setup / band / notes<input style="width:100%" value="${escapeHTML(e.notes)}" oninput="updateExercise(${ix},'notes',this.value)"></label></div><p class="muted small" id="advice-${ix}">${advice(p,e)}</p></section>`}).join('')}<div class="card"><label>Session notes<textarea rows="2" oninput="updateDraft('notes',this.value)">${escapeHTML(d.notes)}</textarea></label><button class="primary" style="margin-top:15px;width:100%" onclick="finish()">Save completed workout</button></div>`}
function advice(p,e){let reps=e.sets.map(s=>Number(s.reps));if(e.sets.some(s=>s.reps===''))return 'Log all prescribed sets for a progression suggestion.';if(p.mode==='time')return reps.every(r=>r>=p.max)?'All holds reached target. Increase duration or difficulty carefully.':'Build toward the upper duration target.';if(p.mode==='band')return reps.every(r=>r>=p.max)?'At top of rep range. Consider slightly less assistance/resistance while maintaining form.':'Keep setup consistent and build reps.';if(p.mode==='control')return 'Prioritize controlled reps and consistent technique.';if(p.mode==='added')return 'AMRAP: compare quality reps and added load with your last session.';if(reps.every(r=>r>=p.max))return `All sets reached the top of the range. Consider +${p.step} lb next session if technique and RIR support it.`;return 'Keep load steady and work toward the top of the rep range across all sets.'}
function updateDraft(k,v){state.draft[k]=v;save();if(['bw','durationMinutes','intensityMet'].includes(k)&&$('cal-preview'))$('cal-preview').textContent=calorieText(state.draft)+' · estimate includes resting energy'}function updateSet(i,j,k,v){state.draft.exercises[i].sets[j][k]=v;save();let p=PLAN.find(x=>x.id===state.draft.exercises[i].id);$('advice-'+i).textContent=advice(p,state.draft.exercises[i])}function updateExercise(i,k,v){state.draft.exercises[i][k]=v;save()}function finish(){let d=state.draft;if(!completed(d)){alert('Log at least one set before saving.');return}state.sessions.push(structuredClone(d));state.draft=null;save();toast('Workout saved');go('history')}
function history(){let a=[...state.sessions].sort((x,y)=>y.date.localeCompare(x.date));return `<div class="line"><h1>Workout history</h1><span class="pill">${a.length} sessions</span></div>${a.length?a.map(s=>`<div class="card"><div class="line"><div><h2>${escapeHTML(s.day)} · ${escapeHTML(s.date)}</h2><p class="muted small">${completed(s)} sets · ${fmt(volume(s))} lb volume ${s.bw?'· BW '+escapeHTML(s.bw)+' lb':''} · ${calorieText(s)}</p></div><div class="row"><button onclick="openSession('${s.id}')">Details</button><button class="danger" onclick="deleteSession('${s.id}')">Delete</button></div></div></div>`).join(''):'<p class="muted">Your saved workouts will appear here.</p>'}`}
function openSession(id){let s=state.sessions.find(x=>x.id===id);if(!s)return;view='detail';$('app').innerHTML=`<button onclick="go('history')">← History</button><h1>${s.day} · ${s.date}</h1><p class="muted">Bodyweight: ${escapeHTML(s.bw||'not recorded')} · ${fmt(volume(s))} lb volume · ${calorieText(s)}</p>${s.exercises.map(e=>{let p=PLAN.find(x=>x.id===e.id);return `<div class="card"><h2>${escapeHTML(p?.name||e.id)}</h2><p>${e.sets.map((x,i)=>`Set ${i+1}: ${x.weight!==''?escapeHTML(x.weight)+' lb × ':''}${escapeHTML(x.reps||'—')}${p?.mode==='time'?' sec':' reps'}`).join(' · ')}</p><p class="muted small">${escapeHTML(e.notes||'')} ${e.rir?'· RIR '+escapeHTML(e.rir):''}</p></div>`}).join('')}<p class="muted">${escapeHTML(s.notes||'')}</p>`}
function deleteSession(id){if(confirm('Delete this workout permanently?')){state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}}
function progress(){let ids=PLAN.map(p=>`<option value="${p.id}" ${chartId===p.id?'selected':''}>${escapeHTML(p.day+' · '+p.name)}</option>`).join('');let p=PLAN.find(x=>x.id===chartId),series=state.sessions.flatMap(s=>s.exercises.filter(e=>e.id===chartId).map(e=>({date:s.date,best:Math.max(0,...e.sets.map(x=>Number(x.weight)||0)),reps:e.sets.reduce((a,x)=>a+(Number(x.reps)||0),0),vol:e.sets.reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.reps)||0),0)}))).sort((a,b)=>a.date.localeCompare(b.date));let vals=series.map(x=>p.mode==='time'||p.mode==='band'||p.mode==='control'?x.reps:x.best),max=Math.max(1,...vals),pts=vals.map((v,i)=>`${45+(i/Math.max(1,vals.length-1))*610},${190-v/max*155}`).join(' ');return `<h1>Progress</h1><p class="muted">Exercise-specific history from every saved session.</p><div class="card"><label>Exercise<select style="width:100%" onchange="chartId=this.value;render()">${ids}</select></label><h2 style="margin-top:18px">${p.mode==='time'?'Total seconds':p.mode==='band'||p.mode==='control'?'Total reps':'Top logged weight (lb)'}</h2>${series.length?`<svg viewBox="0 0 700 230" role="img" aria-label="Exercise progress line chart"><line x1="45" y1="190" x2="660" y2="190" stroke="#536575"/><line x1="45" y1="35" x2="45" y2="190" stroke="#536575"/><polyline points="${pts}" fill="none" stroke="#f7a94b" stroke-width="4" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${45+i/Math.max(1,vals.length-1)*610}" cy="${190-v/max*155}" r="5" fill="#f7a94b"/>`).join('')}<text x="10" y="40" fill="#aebfca" font-size="14">${fmt(max)}</text><text x="45" y="215" fill="#aebfca" font-size="13">${series[0].date}</text><text x="570" y="215" fill="#aebfca" font-size="13">${series.at(-1).date}</text></svg><div class="stack">${series.slice().reverse().map(x=>`<div class="line"><span>${x.date}</span><b>${p.mode==='time'||p.mode==='band'||p.mode==='control'?x.reps+' total':x.best+' lb'}</b></div>`).join('')}</div>`:'<p class="muted">Log this exercise to see a chart.</p>'}</div>`}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function exportJSON(){download('forge-backup.json',JSON.stringify({version:1,plan:PLAN,sessions:state.sessions},null,2),'application/json')}
function exportCSV(){let rows=[['date','day','bodyweight_lb','duration_minutes','intensity_met','estimated_calories','exercise','set','weight_lb','reps_or_seconds','rir','notes']];state.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,i)=>rows.push([s.date,s.day,s.bw,s.durationMinutes||'',s.intensityMet||'',calories(s)??'',PLAN.find(p=>p.id===e.id)?.name||e.id,i+1,x.weight,x.reps,e.rir,e.notes]))));download('forge-workouts.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function importJSON(ev){let f=ev.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.sessions))throw Error('Invalid backup');if(!confirm('Replace your current workout history with this backup?'))return;state.sessions=obj.sessions;state.draft=null;save();toast('Backup restored');go('home')}catch(e){alert('Could not import backup: '+e.message)}};reader.readAsText(f)}
function settings(){return `<h1>Data & backups</h1><div class="card"><h2>Your data stays in this browser</h2><p class="muted">This version does not sync across devices. Calories are calculated from entered minutes, bodyweight and a 3.5 MET moderate / 6 MET vigorous choice; these are rough gross-energy estimates, not measured expenditure. Clearing browser data can erase sessions. Export backups regularly until cloud storage is connected.</p><div class="row"><button class="primary" onclick="exportJSON()">Download full JSON backup</button><button onclick="exportCSV()">Export workout CSV</button></div></div><div class="card"><h2>Restore a FJORGE backup</h2><p class="muted">Restoring replaces your current sessions. This accepts JSON backups exported from this version of FJORGE.</p><input type="file" accept=".json,application/json" onchange="importJSON(event)"></div><div class="card"><h2>Source program</h2><p>Workout Tracker v3 · ${PLAN.length} exercises · Monday / Tuesday / Thursday / Friday</p><p class="muted">Each set supports independent weights for back-off sets. Weight units and progression increments are taken from the workbook's Plan & Guide sheet. Weighted volume excludes band, control, and timed exercises.</p></div>`}
function render(){$('app').innerHTML=({home,log,history,progress,settings}[view]||home)()}render();
</script></body></html>
